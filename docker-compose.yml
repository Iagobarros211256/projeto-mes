services:
  postgres:
    image: postgres:16
    container_name: biscoitos-postgres
    environment:
      POSTGRES_DB: biscoitos_manutencao
      POSTGRES_USER: biscoitos
      POSTGRES_PASSWORD: biscoitos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biscoitos -d biscoitos_manutencao"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
