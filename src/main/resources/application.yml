spring:
  application:
    name: manutencao-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/biscoitos_manutencao
    username: biscoitos
    password: biscoitos

  jpa:
    # Schema é gerenciado 100% pelo Flyway — Hibernate só valida que a entidade bate com a tabela.
    # Evita o clássico problema de "funciona local, quebra em produção" por causa de auto-DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

logging:
  level:
    com.biscoitos.manutencao: DEBUG
