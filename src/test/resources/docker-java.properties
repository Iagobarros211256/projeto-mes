# Docker 29+ elevou a API mínima aceita pelo daemon (1.40/1.44, dependendo da versão exata).
# O Testcontainers 1.20.1 usa um valor padrão antigo (1.32) na fase de DETECÇÃO do ambiente
# Docker, e esse valor é fixo — a variável de ambiente DOCKER_API_VERSION não é lida nessa
# fase específica (só afetaria chamadas posteriores, que nunca são alcançadas se a detecção
# já falhar antes). Esse arquivo, no classpath de teste, é o mecanismo que a própria lib
# docker-java (usada por baixo do Testcontainers) documenta pra isso.
#
# 1.51 fica dentro da faixa aceita pelo Docker instalado localmente (mínimo 1.40/1.44,
# máximo 1.54, conforme `docker version --format '{{.Server.APIVersion}}'`).
api.version=1.51
